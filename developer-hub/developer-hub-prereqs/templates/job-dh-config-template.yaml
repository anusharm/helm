apiVersion: batch/v1
kind: Job
metadata:
  name: dh-config-template
  annotations:
    {{- include "developer-hub-prereqs.argocd-syncwave" . | nindent 4 }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 100
  template:
    spec:
      containers:
      - name: dh-config-template
        command:
          - /bin/bash
          - '-c'
          - |
            set -x
            ansible-playbook -i localhost /scripts/playbook.yaml
        image: quay.io/agnosticd/ee-multicloud:latest
        volumeMounts:
          - mountPath: /scripts
            name: dh-config-vol
      restartPolicy: Never
      volumes:
      - name: dh-config-vol
        configMap:
          name: dh-config-template
