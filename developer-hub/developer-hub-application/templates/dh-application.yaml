apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "developer-hub-application.name" . }}
  namespace: {{ .Values.gitops.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    name: ""
    namespace: {{ include "developer-hub-application.namespace" . }}
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
      limit: 15
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
  source:
    repoURL: 'https://{{ .Values.git.host }}/{{ .Values.git.group }}/{{ .Values.git.repo }}.git'
    targetRevision: {{ .Values.git.revision }}
    path: .
    directory:
      recurse: false
