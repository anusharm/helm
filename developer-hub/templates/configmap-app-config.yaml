kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-rhdh
  labels:
    {{- include "developer-hub.labels" . | nindent 4 }}
  annotations:
    {{- include "developer-hub.argocd-syncwave" . | nindent 4 }}
data:
  app-config-rhdh.yaml: |
    app:
      title: {{ .Values.appConfig.app.title }}
      baseUrl: https://{{ .Values.appConfig.app.baseUrl }}

    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true

    backend:
      baseUrl: https://{{ .Values.appConfig.app.baseUrl }}
      listen:
        port: 7007
        host: 0.0.0.0

    integrations:
      gitlab:
        - apiBaseUrl: https://{{ .Values.appConfig.gitlab.host }}/api/v4
          baseUrl: https://{{ .Values.appConfig.gitlab.host }}
          host: {{ .Values.appConfig.gitlab.host }}
          token: ${GITLAB_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, Domain]
      locations: []

    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: main
              url: https://{{ .Values.appConfig.argocd.host }}
              username: admin
              password: ${ARGOCD_PASSWORD}

    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - clusters:
            - name: dev-cluster
              url: {{ .Values.appConfig.kubernetes.apiUrl }}
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          type: config
      customResources:
        - group: tekton.dev
          apiVersion: v1beta1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1beta1
          plural: taskruns
