apiVersion: rhdh.redhat.com/v1alpha3
kind: Backstage
metadata:
  name: {{ .Values.backstage.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "developer-hub.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      {{- with .Values.backstage.appConfig.configMaps }}
      configMaps:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.backstage.dynamicPluginsConfigMapName }}
    dynamicPluginsConfigMapName: {{ . }}
    {{- end }}
    extraEnvs:
      {{- with .Values.backstage.extraEnvs.secrets }}
      secrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    extraFiles:
      mountPath: /opt/app-root/src
    replicas: {{ .Values.backstage.replicas }}
    route:
      enabled: {{ .Values.backstage.route.enabled }}
  database:
    enableLocalDb: true
