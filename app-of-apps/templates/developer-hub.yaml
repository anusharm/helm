apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.developerHub.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  destination:
    namespace: {{ .Values.developerHub.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: developer-hub
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        vault:
          namespace: {{ .Values.vault.namespace }}
          name: {{ .Values.vault.name }}
        appConfig:
          app:
            title: {{ .Values.developerHub.appConfig.app.title }}
            baseUrl: {{ .Values.developerHub.appConfig.app.baseUrl }}
          gitlab:
            host: {{ .Values.developerHub.appConfig.gitlab.host }}
          argocd:
            host: {{ .Values.developerHub.appConfig.argocd.host }}
          kubernetes:
            apiUrl: {{ .Values.developerHub.appConfig.kubernetes.apiUrl }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
